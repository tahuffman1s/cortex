name: Release

# Publishes a release with the AppImage, the source tarball, their checksums,
# and release-notes/<tag>.md as its notes. Either push a tag like v0.1.0 (or make
# one with "Draft a new release" on GitHub), or run this workflow by hand on a
# branch: it then tags that commit v<the version in meson.build> itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            gir1.2-secret-1 desktop-file-utils appstream gvfs librsvg2-common adwaita-icon-theme libglib2.0-bin file patchelf shared-mime-info
      - name: Check the version
        run: |
          tag="$GITHUB_REF_NAME"
          meson setup build
          version="$(meson introspect --projectinfo build | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')"
          app="$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' src/cortex/application.py)"
          metainfo="$(grep -o -m1 '<release version="[^"]*"' data/io.github.tahuffman1s.Cortex.metainfo.xml | cut -d'"' -f2)"
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            # run by hand: the tag is made from the version, and must be new
            tag="v$version"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists: bump the version first" >&2
              exit 1
            fi
          fi
          echo "tag $tag, meson $version, app $app, metainfo $metainfo"
          test "$tag" = "v$version" && test "$app" = "$version" && test "$metainfo" = "$version"
          test -s "release-notes/$tag.md"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Build and test the tarball
        # (meson dist writes the .sha256sum next to it)
        run: meson dist -C build --formats xztar
      - name: Build the AppImage
        run: |
          build-aux/appimage/build.sh dist
          cd dist
          APPIMAGE_EXTRACT_AND_RUN=1 "./Cortex-$VERSION-x86_64.AppImage" --version
          sha256sum "Cortex-$VERSION-x86_64.AppImage" > "Cortex-$VERSION-x86_64.AppImage.sha256sum"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Cortex ${{ env.VERSION }}
          body_path: release-notes/${{ env.TAG }}.md
          files: |
            dist/Cortex-${{ env.VERSION }}-x86_64.AppImage
            dist/Cortex-${{ env.VERSION }}-x86_64.AppImage.sha256sum
            build/meson-dist/cortex-${{ env.VERSION }}.tar.xz
            build/meson-dist/cortex-${{ env.VERSION }}.tar.xz.sha256sum
